# Copy to ~/.config/amt/config.yaml (or $XDG_CONFIG_HOME/amt/config.yaml,
# or anywhere with AMT_CONFIG=/path/to/config.yaml) and chmod 600.
# ~/.amt/config.yaml is still read for configurations written before the move.
# Never commit the real configuration or its credentials.
#
# `default:` selects the machine used by a bare command. `--machine <name>`
# or AMT_MACHINE selects another one; `amt-cli machines` lists all targets.
default: primary

machines:
  primary:
    host: 192.0.2.10         # RFC 5737 documentation address: replace it
    port: 16993              # WS-Man over TLS
    username: admin
    password: CHANGE_ME

  secondary:
    host: 198.51.100.20      # RFC 5737 documentation address: replace it
    port: 16993
    username: admin
    password: CHANGE_ME
    # Optional: defaults to the WS-Man port + 2 (16993 -> 16995).
    redirection_port: 16995
    # Optional inventory label used only to recognise DHCP leases.
    # Nothing on the wire uses this value.
    mac: 02:00:00:00:00:20

# The older single-machine form still loads:
#
# amt:
#   host: 192.0.2.10
#   port: 16993
#   username: admin
#   password: CHANGE_ME
